[package]
name = "lock"
version = "0.2.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
libc = "0.2.191"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
regex = "1.13.1"
rpassword = "7.5.4"
sha2 = "0.11.1"
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3.27.0"
